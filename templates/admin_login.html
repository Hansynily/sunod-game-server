<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Sunod Telemetry - Dashboard Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="/static/fonts/outfit.css" rel="stylesheet" />
    <style>
        :root {
            --bg: #f2ede4;
            --bg2: #e8e2d8;
            --panel: #faf8f3;
            --fg: #141210;
            --border: #141210;
            --muted: #6b6560;
            --accent: #d64f1e;
            --accent-fg: #ffffff;
            --shadow: 4px 4px 0 #141210;
        }

        [data-theme="dark"] {
            --bg: #111210;
            --bg2: #1c1e1a;
            --panel: #181a17;
            --fg: #ede8df;
            --border: #ede8df;
            --muted: #888078;
            --accent: #e8622c;
            --accent-fg: #ffffff;
            --shadow: 4px 4px 0 #ede8df;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem 1.25rem;
            background: var(--bg);
            color: var(--fg);
            font-family: "Outfit", sans-serif;
            transition: background 0.15s, color 0.15s;
        }

        .page-shell {
            width: min(100%, 420px);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .wordmark {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .theme-toggle {
            font-family: "Outfit", sans-serif;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 0.4rem 0.8rem;
            background: transparent;
            color: var(--muted);
            border: 1.5px solid var(--border);
            cursor: pointer;
            transition: background 0.1s, color 0.1s;
        }

        .theme-toggle:hover {
            background: var(--fg);
            color: var(--bg);
        }

        .card {
            background: var(--panel);
            border: 2px solid var(--border);
            box-shadow: var(--shadow);
        }

        .card-title-block {
            padding: 1.5rem 1.6rem 1.35rem;
            border-bottom: 2px solid var(--border);
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }

        .accent-bar {
            width: 5px;
            min-height: 52px;
            background: var(--accent);
            flex-shrink: 0;
            margin-top: 3px;
        }

        .title-text h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.05;
        }

        .title-text p {
            margin-top: 0.45rem;
            font-size: 0.82rem;
            color: var(--muted);
            font-weight: 400;
            line-height: 1.5;
        }

        .card-body {
            padding: 1.6rem;
        }

        .error {
            border-left: 4px solid var(--accent);
            background: transparent;
            color: var(--accent);
            padding: 0.65rem 0.85rem;
            margin-bottom: 1.4rem;
            font-size: 0.82rem;
            font-weight: 500;
        }

        .field {
            margin-bottom: 1.15rem;
        }

        label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--muted);
            margin-bottom: 0.4rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 0.85rem;
            border: 1.5px solid var(--border);
            background: var(--bg2);
            color: var(--fg);
            font-family: "Outfit", sans-serif;
            font-size: 0.95rem;
            font-weight: 400;
            outline: none;
            transition: border-color 0.1s, box-shadow 0.1s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 3px 3px 0 var(--accent);
        }

        .submit-button {
            width: 100%;
            margin-top: 0.35rem;
            padding: 0.85rem 1rem;
            border: 2px solid var(--border);
            background: var(--accent);
            color: var(--accent-fg);
            font-family: "Outfit", sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform 0.08s, box-shadow 0.08s;
        }

        .submit-button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--border);
        }

        .submit-button:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        .card-footer {
            border-top: 1.5px dashed var(--border);
            padding: 0.6rem 1.6rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-footer span {
            font-size: 0.65rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.13em;
            color: var(--muted);
        }
    </style>
</head>
<body>
<div class="page-shell">
    <div class="topbar">
        <span class="wordmark">Sunod / Telemetry</span>
        <button id="theme-toggle" class="theme-toggle" type="button">Dark mode</button>
    </div>

    <section class="card">
        <div class="card-title-block">
            <div class="accent-bar"></div>
            <div class="title-text">
                <h1>Dashboard<br>Login</h1>
            </div>
        </div>

        <div class="card-body">
            {% if error_message %}
                <div class="error">{{ error_message }}</div>
            {% endif %}

            <form method="post" action="/admin/login">
                <div class="field">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" autocomplete="username" required />
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required />
                </div>
                <button class="submit-button" type="submit">Enter Dashboard</button>
            </form>
        </div>

        <div class="card-footer">
            <span>Sunod &copy; 2026</span>
        </div>
    </section>
</div>

<script>
    (function () {
        const root = document.documentElement;
        const toggle = document.getElementById("theme-toggle");
        const key = "sunod_theme";

        function applyTheme(theme) {
            root.setAttribute("data-theme", theme);
            toggle.textContent = theme === "light" ? "Dark mode" : "Light mode";
        }

        applyTheme(localStorage.getItem(key) || "light");

        toggle.addEventListener("click", function () {
            const next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
            applyTheme(next);
            localStorage.setItem(key, next);
        });
    })();
</script>
</body>
</html>
