{% extends "_base.html" %}
{% block title %}Log in{% endblock %}
{% block nav %}{% endblock %}

{% block header %}{% endblock %}

{% block content %}
<div class="auth" style="min-height: calc(100vh - 92px)">
    <div class="auth-card">
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:18px">
            <span class="brand-mark" style="border-color: var(--ink); width:44px; height:44px; font-size:22px">S</span>
            <div><div class="strong" style="font-size:22px; line-height:1">SUNOD</div><div class="eyebrow">Admin dashboard</div></div>
        </div>
        <section class="section block-yellow" style="margin-top:0">
            <div class="section-head"><h2>Log in</h2></div>
            <div class="section-body">
                <form method="post" action="/admin/login" style="display:grid; gap:14px">
                    <div class="field"><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" required autofocus /></div>
                    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required /></div>
                    <button class="btn btn-primary" type="submit" style="width:100%">Log in</button>
                </form>
            </div>
        </section>
    </div>
</div>
{% endblock %}
