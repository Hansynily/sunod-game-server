<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>{{ title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="/static/fonts/outfit.css" rel="stylesheet" />
    <style>
        :root {
            --bg: #f4ede1;
            --panel: #fff9f1;
            --text: #19130e;
            --muted: #675f58;
            --border: #19130e;
            --accent: #d4552c;
            --success: #5f9d55;
            --shadow: 6px 6px 0 #19130e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.25rem;
            background:
                radial-gradient(circle at top left, rgba(212, 85, 44, 0.14), transparent 24%),
                linear-gradient(180deg, var(--bg), #efe4d4 100%);
            color: var(--text);
            font-family: "Outfit", sans-serif;
        }

        .card {
            width: min(100%, 560px);
            padding: 1.75rem;
            background: var(--panel);
            border: 2px solid var(--border);
            box-shadow: var(--shadow);
        }

        .eyebrow {
            color: var(--muted);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0.8rem 0 0.75rem;
            font-size: clamp(2.2rem, 7vw, 3.4rem);
            line-height: 0.95;
            letter-spacing: -0.06em;
        }

        p {
            margin: 0;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.65;
        }

        .status {
            display: inline-flex;
            align-items: center;
            margin-top: 1rem;
            padding: 0.4rem 0.6rem;
            border: 1.5px solid var(--border);
            background: {% if success %}rgba(95, 157, 85, 0.15){% else %}rgba(212, 85, 44, 0.16){% endif %};
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
<section class="card">
    <span class="eyebrow">Sunod / Email verification</span>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <div class="status">{% if success %}Verified{% else %}Action needed{% endif %}</div>
</section>
</body>
</html>
